name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: cover
        run: |
          cd src/js
          npm install
          npm run build
          cd ../cs
          bash ./.scripts/llvm.sh
          bash ./.scripts/pack.sh
          dotnet test /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:ExcludeByAttribute=GeneratedCodeAttribute
          cd ../js/test/cs
          dotnet workload restore
          cd ../..
          npm run compile-test
          npm run cover
      - name: upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The `cover` job publishes -c Debug, which is Mono. Every mechanism ADR-0002 relies on — awaited
  # primitive imports, handle scopes, deterministic release — ships on the NativeAOT-LLVM path and
  # is otherwise untested (ADR-0006 §4, research/06 implication 10). This job publishes an exercise
  # worker with BsLlvm=true and runs it under real workerd.
  #
  # Kept as its own job rather than a step of `cover`: it needs the Emscripten packs and a workerd
  # download, and a failure here must be legible as "the LLVM lane broke", not as lost coverage.
  # macOS cannot run it at all until bootsharp ships an osx host ILCompiler-LLVM pack (ADR-0006).
  llvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: llvm end-to-end
        run: |
          # NativeAOT-LLVM links with emcc, which arrives with the wasm-tools workload.
          dotnet workload install wasm-tools
          cd src/js
          npm install
          npm run build
          cd ../cs
          bash ./.scripts/llvm.sh
          bash ./.scripts/pack.sh
          cd ../js
          npm run test:llvm
          # The other two workerd lanes share this job's setup — the LLVM artifacts, the local pack
          # and the workerd download are the expensive parts, and each lane publishes its own guest
          # from them. A lane of its own per harness would pay for all three again.
          #
          # test:interleave records Durable Object scheduling semantics that no unit test can reach
          # (input-gate release points, hibernation wake identity); test:signalr drives the hub over
          # a real socket with the stock @microsoft/signalr client, which is the one claim in
          # ADR-0010 that is about somebody else's client and so cannot be asserted in-process.
          npm run test:interleave
          npm run test:signalr

  # Bootsharp.Cloudflare.AspNetCore carries 140 files copied verbatim from dotnet/aspnetcore, with
  # every local change expressed as a declarative transform in Vendored/manifest.json rather than as
  # an edit in the tree (ADR-0008 §3, research/09 §10). That only holds if something re-renders them
  # and compares: an edit made directly to a vendored file, or a transform whose anchor upstream
  # moved, is otherwise invisible until the next manual bump.
  #
  # The clone is filtered and sparse — the two source subtrees the manifest names, ~27 MB and a few
  # seconds, not the ~2 GB full history — and is pinned to the manifest's own commit, so this job
  # answers "does the tree still match what the manifest says it is", never "did upstream change".
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: check vendored sources for drift
        run: |
          cd src/cs/Bootsharp.Cloudflare.AspNetCore
          commit=$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("Vendored/manifest.json")).commit)')
          mkdir -p /tmp/aspnetcore && cd /tmp/aspnetcore
          git init -q .
          git remote add origin https://github.com/dotnet/aspnetcore.git
          git sparse-checkout set --no-cone "src/Http" "src/Shared"
          git fetch --filter=blob:none --depth 1 origin "$commit"
          git checkout -q FETCH_HEAD
          cd "$GITHUB_WORKSPACE/src/cs/Bootsharp.Cloudflare.AspNetCore"
          deno run -A Vendored/vendor.ts --check --upstream /tmp/aspnetcore
